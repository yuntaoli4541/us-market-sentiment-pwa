<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="情绪观察">
    <title>美股情绪观察</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased p-4">
    <div class="max-w-md mx-auto mt-6">
        <h1 class="text-2xl font-bold text-blue-900 mb-1">美股情绪观察看板</h1>
        <p id="date-display" class="text-sm text-slate-500 mb-6">加载中...</p>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-4">
            <h2 class="text-sm font-bold text-slate-400 mb-2">VIX 恐慌指数</h2>
            <div class="text-3xl font-black text-slate-800 mb-2" id="vix-value">--</div>
            <div class="inline-block px-3 py-1 rounded-full text-sm font-bold" id="vix-status">--</div>
            <p class="mt-3 text-sm text-slate-600">💡 操作建议：<span id="vix-tip" class="font-bold text-slate-800">--</span></p>
        </div>

        <a href="public/report.pdf" class="block w-full bg-blue-600 text-white text-center font-bold py-4 rounded-xl shadow-md active:bg-blue-700 transition" target="_blank">
            📄 查看今日完整 PDF 报告
        </a>
    </div>

    <script>
        // 自动拉取 GitHub Actions 生成的最新数据
        fetch('public/data.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('date-display').innerText = "最新数据：" + data.date;
                document.getElementById('vix-value').innerText = data.VIX;
                
                const statusBadge = document.getElementById('vix-status');
                statusBadge.innerText = data.VIX_Status;
                if (data.VIX_Status.includes('正常') || data.VIX_Status.includes('乐观')) {
                    statusBadge.classList.add('bg-green-100', 'text-green-700');
                } else {
                    statusBadge.classList.add('bg-red-100', 'text-red-700');
                }
                
                document.getElementById('vix-tip').innerText = data.VIX_Tip;
            })
            .catch(error => {
                document.getElementById('date-display').innerText = "数据获取失败，请检查网络或稍后再试。";
            });
    </script>
</body>
</html>
