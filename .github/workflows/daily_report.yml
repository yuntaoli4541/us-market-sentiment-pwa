# Updated: 2026-05-19
name: Generate Daily Market Report

on:
  schedule:
    # 每个交易日收盘后运行：21:15 UTC = 美东 17:15
    # 兼容夏令时(EDT UTC-4)和冬令时(EST UTC-5)，两个时区都已收盘
    - cron: '15 21 * * 1-5'

  # 允许手动触发（调试用）
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run report script
        run: python scripts/generate_report.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json public/report.pdf || true
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: daily report $(date -u '+%Y-%m-%d') [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit"
          fi
