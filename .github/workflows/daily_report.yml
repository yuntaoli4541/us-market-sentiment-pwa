name: Generate Daily Market Report

on:
  schedule:
    - cron: '5 20 * * 1-5'
  workflow_dispatch:

# 解决 Node.js 20 警告的环境变量配置
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-report:
    runs-on: ubuntu-latest
    # 显式声明需要的内容写入权限
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 fonts-noto-cjk

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run report script
      run: python scripts/generate_report.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add public/data.json public/report.pdf || true
        # 检查是否有文件变动
        if ! git diff-index --quiet HEAD; then
          git commit -m "chore: automated daily report update [skip ci]"
          # 关键新增：在推送前先拉取网页上的最新变动，防止冲突
          git pull --rebase origin main
          git push
        else
          echo "No changes to commit"
        fi
