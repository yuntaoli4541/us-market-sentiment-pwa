name: Generate Daily Market Report

on:
  schedule:
    # 每天周一到周五的 UTC 时间 20:05 运行（对应美东夏令时 16:05，即盘后5分钟）
    - cron: '5 20 * * 1-5'
  workflow_dispatch: # 允许您在 GitHub 页面上手动点击按钮立即触发，方便测试

jobs:
  build-and-report:
    runs-on: ubuntu-latest

    steps:
    # 1. 检查并下载仓库代码到云端虚拟机
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 安装渲染 PDF 所需的 Linux 底层字体和图形库依赖
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 fonts-noto-cjk

    # 4. 安装 Python 依赖包
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 5. 运行 Python 脚本，抓取数据并生成文件
    - name: Run report script
      run: python scripts/generate_report.py

    # 6. 自动将生成的最新 data.json 和 report.pdf 提交并推送到您的仓库
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add public/data.json public/report.pdf || echo "No files to add"
        git commit -m "chore: automated daily report update [skip ci]" || echo "No changes to commit"
        git push
