name: Generate Daily Market Report

on:
  schedule:
    # ─── 盘中：每5分钟触发（GitHub Actions 最小间隔限制）────────
    # job 内部会循环跑5次，每次间隔60秒，实际效果 ≈ 每分钟更新
    - cron: '*/5 13-21 * * 1-5'

    # ─── 收盘兜底：21:15 UTC 补跑一次确保最终收盘价被记录 ───────
    - cron: '15 21 * * 1-5'

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 防止多个 job 同时运行互相冲突
concurrency:
  group: market-update
  cancel-in-progress: false   # 排队等待，不强制取消

jobs:
  build-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run report script (每分钟循环5次)
        run: |
          for i in 1 2 3 4 5; do
            echo "─── 第 $i/5 次运行 $(date -u '+%H:%M:%S UTC') ───"
            python scripts/generate_report.py

            # 每次运行后立即 commit（不 push，减少网络开销）
            git add public/data.json public/report.pdf || true
            if ! git diff-index --quiet HEAD; then
              git commit -m "chore: auto update $(date -u '+%H:%M UTC') [skip ci]"
            else
              echo "No changes this round"
            fi

            # 最后一次不需要等待
            if [ $i -lt 5 ]; then
              sleep 60
            fi
          done

      - name: Push all commits at once
        run: |
          git pull --rebase origin main
          git push
